[project]
name = "opentraceai"
version = "0.5.0"
description = "OpenTrace Python agent — maps system architecture, code structure, and service relationships into a knowledge graph"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "OpenTrace Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "gitpython>=3.1",
    "tree-sitter>=0.24",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "click>=8.0",
    "mcp>=1.0",
    "real-ladybug>=0.13",
    "starlette>=0.27",
    "uvicorn>=0.24",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "openai>=1.0",
    # Knowledge graph + doc ingestion — required by the headline wikiv3
    # features (index --extract-entities, --build-pages, cluster, analyze,
    # export-graph). markitdown[all] bundles PDF/DOCX/audio/video adapters;
    # faster-whisper handles audio transcription; yt-dlp pulls YouTube
    # transcripts. networkx powers community detection + exports.
    "networkx>=3.0",
    "markitdown[all]>=0.1.5",
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
summarization = [
    "optimum[onnxruntime]>=1.17",
    "transformers>=4.38",
]
swe-bench = [
    "anthropic>=0.40",
]
# Vestigial — the packages that used to live here are now in core deps.
# Kept so existing `pip install opentraceai[graph]` callers don't break.
graph = [
    "networkx>=3.0",
    "markitdown[all]>=0.1.5",
    "faster-whisper>=1.0",
    "yt-dlp>=2024.1",
    "anthropic>=0.40",
    "openai>=1.0",
]
# Leiden community detection — graspologic doesn't support Python 3.13 yet,
# so it has to stay opt-in. `cluster` falls back to Louvain (in networkx)
# when graspologic isn't installed.
graph-leiden = [
    "graspologic; python_version < '3.13'",
]
# Filesystem watcher for `opentraceai watch`. Only that one command uses it.
graph-watch = [
    "watchdog>=3.0",
]

[project.urls]
Homepage = "https://github.com/opentrace/opentrace"
Repository = "https://github.com/opentrace/opentrace"
Issues = "https://github.com/opentrace/opentrace/issues"

[project.scripts]
opentrace = "opentrace_agent.cli.main:app"
opentraceai = "opentrace_agent.cli.main:app"
opentraceai-bench = "opentrace_agent.cli.bench:app"

[dependency-groups]
# watchdog: optional at runtime (graph-watch extra) but needed so the watch
# tests exercise the real event handler instead of skipping.
dev = ["pytest", "pytest-anyio", "ruff", "watchdog>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentrace_agent"]

[tool.ruff]
line-length = 120
exclude = ["src/opentrace_agent/gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
