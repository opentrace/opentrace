// Code graph schema for protoc-gen-ladybug.
//
// Defines the node types and relationship types used by the code indexing
// pipeline. Running protoc-gen-ladybug on this file generates TypeScript
// constants (NODE_SCHEMA_STATEMENTS, REL_SCHEMA, NodeType, RelType) that
// the LadybugDB store uses to create typed tables.
//
// Usage:
//   make graph   # from proto/

syntax = "proto3";

package opentrace.v1;

option go_package = "github.com/opentrace/opentrace/api/pkg/gen/otv1";

import "ladybug/options.proto";

// ---- Node types ----------------------------------------------------------

// RepositoryNode represents a source code repository.
message RepositoryNode {
  string id             = 1;
  string name           = 2;
  string ref            = 3;
  string source_uri     = 4 [(ladybug.column) = "sourceUri"];
  string provider       = 5;
  string default_branch = 6 [(ladybug.column) = "defaultBranch"];
  string summary        = 7;
  // Filesystem path when the repo was indexed from a local directory.
  // Empty for cloned remote repos (clone is not retained after indexing).
  string local_path     = 8 [(ladybug.column) = "localPath"];
}

// DirectoryNode represents a directory in a repository.
message DirectoryNode {
  string id      = 1;
  string name    = 2;
  string path    = 3;
  string summary = 4;
}

// FileNode represents a source code file.
message FileNode {
  string id         = 1;
  string name       = 2;
  string path       = 3;
  string extension  = 4;
  string language   = 5;
  string source_uri = 6 [(ladybug.column) = "sourceUri"];
  int32  lines      = 7;   // total line count
  string summary    = 8;
}

// ClassNode represents a class, struct, record, type alias, or similar type definition.
message ClassNode {
  string id         = 1;
  string name       = 2;
  string language   = 3;
  int32  start_line = 4 [(ladybug.column) = "startLine"];
  int32  end_line   = 5 [(ladybug.column) = "endLine"];
  string signature  = 6;
  string docs       = 7;
  string kind       = 8;   // "class", "struct", "interface", "record", "dataclass", "type_alias"
  repeated string superclasses = 9;
  repeated string interfaces   = 10;
  string summary               = 11;
}

// FunctionNode represents a standalone function or method.
message FunctionNode {
  string id         = 1;
  string name       = 2;
  string language   = 3;
  int32  start_line = 4 [(ladybug.column) = "startLine"];
  int32  end_line   = 5 [(ladybug.column) = "endLine"];
  string signature  = 6;
  string docs       = 7;
  string summary    = 8;
}

// DependencyNode represents an external package dependency declared in a manifest
// (package.json, pyproject.toml, go.mod, pom.xml, Cargo.toml, Gemfile, etc.).
message DependencyNode {
  string id       = 1;
  string name     = 2;
  string version  = 3;   // version constraint: "^4.17", ">=2.28", "v1.2.3"
  string registry = 4;   // "npm", "pypi", "go", "maven", "crates.io", "rubygems"
}

// PullRequestNode represents a pull/merge request.
message PullRequestNode {
  string id            = 1;
  string name          = 2;
  int32  number        = 3;
  string title         = 4;
  string state         = 5;   // "open", "closed", "merged"
  string author        = 6;
  string url           = 7;
  string created_at    = 8  [(ladybug.column) = "createdAt"];
  string base_branch   = 9  [(ladybug.column) = "baseBranch"];
  string head_branch   = 10 [(ladybug.column) = "headBranch"];
  int32  additions     = 11;
  int32  deletions     = 12;
  int32  files_changed = 13 [(ladybug.column) = "filesChanged"];
}

// VariableNode represents a variable, parameter, or field.
message VariableNode {
  string id              = 1;
  string name            = 2;
  string language        = 3;
  int32  start_line      = 4 [(ladybug.column) = "startLine"];
  int32  end_line        = 5 [(ladybug.column) = "endLine"];
  string kind            = 6;   // "parameter", "local", "field"
  bool   exported        = 7;
  string type_annotation = 8 [(ladybug.column) = "typeAnnotation"];
  string docs            = 9;
}

// ConfidenceTier records how a wiki or semantic edge/node was derived, so
// downstream consumers can tell directly observed facts apart from model
// judgement.
//
//   EXTRACTED  — the source states the relationship itself; a reader could
//                point at the line that asserts it.
//   INFERRED   — concluded from context rather than from any explicit
//                statement. Usually right, weighted below EXTRACTED.
//   AMBIGUOUS  — a candidate the producer could neither confirm nor rule
//                out, kept so review tooling can surface it rather than
//                lose it.
enum ConfidenceTier {
  CONFIDENCE_TIER_UNSPECIFIED = 0;
  CONFIDENCE_TIER_EXTRACTED   = 1;
  CONFIDENCE_TIER_INFERRED    = 2;
  CONFIDENCE_TIER_AMBIGUOUS   = 3;
}

// KnowledgeVaultNode represents a knowledge vault — a named collection of
// indexed documents produced by the wiki ingest pipeline. One per vault directory.
message KnowledgeVaultNode {
  string id                  = 1;          // vault name (validated, no separators)
  string name                = 2;          // display name (same as id today)
  string last_compiled_at    = 3 [(ladybug.column) = "lastCompiledAt"];   // ISO-8601 UTC
  string summary             = 4;
  // "local" (vault lives in <project>/.opentrace/vaults/) or "global"
  // (vault lives in ~/.opentrace/vaults/ or $OT_VAULT_ROOT). Local vaults
  // are visible only to the project they were compiled in; global vaults
  // can be attached to any graph via ``opentraceai vault attach``.
  string scope               = 5;
  // ISO-8601 UTC timestamp of the most recent ``write_vault_to_graph``
  // call into THIS graph store. Compared against the disk vault's
  // ``last_compiled_at`` to surface stale mirrors in ``vault list``.
  string mirror_compiled_at  = 6 [(ladybug.column) = "mirrorCompiledAt"];
  // Repo id this vault was spawned from, when it was built by
  // ``index --wiki`` over a repository walk (the same runs that emit a
  // Repository -DOCUMENTS-> KnowledgeVault edge). Empty for vaults compiled
  // from uploads/URLs and for attached globals.
  string spawned_from        = 7 [(ladybug.column) = "spawnedFrom"];
}

// NOTE (2026-08-04): a KnowledgeConceptNode message defined the concept-page
// layer here until this date. It is removed rather than retained-for-legacy
// (the convention SemanticEdgeRel/MentionsRel follow) because it never shipped
// on a release branch — no graph anywhere contains a KnowledgeConcept node.
// Do not re-add it: page synthesis measured 88.4% against a 98.6% control
// (−10.2pp, the worst result on record) because restating a source strips its
// hedges, tense, and attribution. Verbatim corpus bodies plus an exhaustive
// `grep` answer the same questions without the restatement. See
// agent/src/opentrace_agent/wiki/CLAUDE.md.

// KnowledgeDocNode represents a document ingested into the wiki corpus.
// Identity is the sha256 of the RAW bytes; the normalized markdown body is
// persisted to `.opentrace/corpus/<sha>.md` (referenced by corpus_path) so it's readable
// via load_source and available for re-extraction and grep. Carries the
// navigation label (title + one_line_summary; the `summary` copy feeds FTS).
message KnowledgeDocNode {
  string id               = 1;       // `corpus::<sha256>`
  string name             = 2;       // original filename
  string sha256           = 3;
  string filename         = 4;
  string content_type     = 5 [(ladybug.column) = "contentType"];   // e.g. "application/pdf"
  int64  size_bytes       = 6 [(ladybug.column) = "sizeBytes"];
  string acquired_at      = 7 [(ladybug.column) = "acquiredAt"];    // ISO-8601 UTC
  string corpus_path      = 8 [(ladybug.column) = "corpusPath"];    // relative to .opentrace/
  string title            = 9;       // display title (derived from filename)
  string one_line_summary = 10 [(ladybug.column) = "oneLineSummary"];
  string summary          = 11;      // copy of the one-liner; feeds search_text FTS
  string path             = 12;      // repo-relative path when repo-walked (see MirrorsRel)
}

// CommunityNode represents a cluster of related nodes detected by Leiden/Louvain.
// Written by `opentraceai cluster`. The `members` count is stored for fast
// summary rendering without traversing membership edges.
message CommunityNode {
  string id          = 1;
  string name        = 2;   // human-readable label, e.g. "Attention Mechanism"
  int32  community_id = 3 [(ladybug.column) = "communityId"];
  double cohesion    = 4;   // 0.0–1.0, intra-community edge density
  int32  members     = 5;   // node count in this community
  bool   is_god      = 6 [(ladybug.column) = "isGod"];   // true if this is a top-centrality community
}

// HyperedgeNode names a set of three or more nodes that act as one unit —
// a workflow, a layered design, a recurring theme. Stored as a node because
// a property graph has no native n-ary edge; members attach individually
// through ParticipatesInRel.
message HyperedgeNode {
  string id               = 1;
  string name             = 2;   // human-readable label
  string relation         = 3;   // "participate_in", "implement", "form"
  ConfidenceTier confidence = 4;
  double confidence_score = 5 [(ladybug.column) = "confidenceScore"];
  string source_file      = 6 [(ladybug.column) = "sourceFile"];
}

// SemanticEdgeRel represents a semantic edge derived by LLM extraction.
// Source and target are arbitrary graph nodes. The `relation` field is a
// free-form verb naming the edge type (e.g. "calls", "depends_on",
// "rationale_for").
//
// NOTE (2026-08-04): no producer writes these any more. The LLM-extracted
// entity layer that emitted them was removed after three benchmark runs
// measured zero agent usage of the resulting nodes — see
// agent/src/opentrace_agent/wiki/CLAUDE.md. The message is retained so graphs
// built before then stay readable; do not remove or renumber it.
message SemanticEdgeRel {
  string         id               = 1;
  string         source_id        = 2;
  string         target_id        = 3;
  string         relation         = 4;
  ConfidenceTier confidence       = 5;
  double         confidence_score = 6 [(ladybug.column) = "confidenceScore"];
  string         source_file      = 7 [(ladybug.column) = "sourceFile"];
  string         source_location  = 8 [(ladybug.column) = "sourceLocation"];
  double         weight           = 9;
}

// MemberOfCommunityRel links a graph node to its CommunityNode.
message MemberOfCommunityRel {
  string id        = 1;
  string source_id = 2;   // member node
  string target_id = 3;   // CommunityNode
}

// ParticipatesInRel links a graph node to a HyperedgeNode it participates in.
message ParticipatesInRel {
  string id        = 1;
  string source_id = 2;   // member node
  string target_id = 3;   // HyperedgeNode
}

// IndexMetadataNode stores a single record of index provenance per database.
// Written by the CLI after each `opentraceai index` run.
message IndexMetadataNode {
  string id                  = 1;
  string name                = 2;
  string indexed_at          = 3 [(ladybug.column) = "indexedAt"];           // ISO-8601 UTC timestamp
  double duration_seconds    = 4 [(ladybug.column) = "durationSeconds"];
  string repo_id             = 5 [(ladybug.column) = "repoId"];
  string repo_path           = 6 [(ladybug.column) = "repoPath"];
  string commit_sha          = 7 [(ladybug.column) = "commitSha"];
  string commit_message      = 8 [(ladybug.column) = "commitMessage"];
  string branch              = 9;
  string source_uri          = 10 [(ladybug.column) = "sourceUri"];          // git remote URL
  string opentraceai_version = 11 [(ladybug.column) = "opentraceaiVersion"];
  int32  nodes_created       = 12 [(ladybug.column) = "nodesCreated"];
  int32  relationships_created = 13 [(ladybug.column) = "relationshipsCreated"];
  int32  files_processed     = 14 [(ladybug.column) = "filesProcessed"];
  int32  classes_extracted   = 15 [(ladybug.column) = "classesExtracted"];
  int32  functions_extracted = 16 [(ladybug.column) = "functionsExtracted"];
}

// ---- Relationship types --------------------------------------------------

// DefinesRel represents a structural containment relationship:
// Repo defines Dir, Dir defines File, File defines Class, etc.
message DefinesRel {
  string id        = 1;
  string source_id = 2;
  string target_id = 3;
}

// ImportsRel represents an import/use/require dependency.
// Source is the logical consumer (Module, Class); target is what it depends on.
// Examples:
//   Module --Imports--> Module    (Python: import os, Go: import "fmt")
//   Module --Imports--> Class     (Python: from collections import OrderedDict)
//   Module --Imports--> Function  (Python: from os.path import join)
//   Class  --Imports--> Class     (Java: import com.example.Foo)
message ImportsRel {
  string id        = 1;
  string source_id = 2;
  string target_id = 3;
  string alias     = 4;  // import alias if renamed (e.g. "import numpy as np" → alias="np")
}

// CallsRel represents a function/method call relationship.
message CallsRel {
  string id         = 1;
  string source_id  = 2;
  string target_id  = 3;
  float  confidence = 4;
  repeated string args = 5;
}

// DependsOnRel represents a build-level package dependency.
// Repository --DependsOn--> Dependency
message DependsOnRel {
  string id        = 1;
  string source_id = 2;
  string target_id = 3;
}

// DerivedFromRel represents a data-flow relationship between variables.
// Source variable's value is derived from the target variable/function.
message DerivedFromRel {
  string id        = 1;
  string source_id = 2;
  string target_id = 3;
  string transform = 4;  // "identity", "call", "attribute"
}

// LinksToRel represents an author-written cross-reference between two
// KnowledgeDoc nodes. Created by parsing each document's own relative
// markdown links, reference-style definitions, and HTML anchors at ingest
// time — the doc-side analogue of an import edge. Purely mechanical: no LLM,
// no inference.
message LinksToRel {
  string id        = 1;
  string source_id = 2;
  string target_id = 3;
}

// NOTE (2026-08-04): a CitesRel message (concept page → the document it was
// synthesised from) lived here until this date, alongside KnowledgeConceptNode.
// Both are removed outright rather than retained-for-legacy because neither
// ever shipped on a release branch. See the KnowledgeConceptNode note above for
// the measurement that closed the layer.

// MirrorsRel links a KnowledgeDoc to the File node for the same on-disk
// document, for every doc discovered by a repo walk. When the code walk
// didn't create the File node (extensions like .rst/.txt/.html/PDFs), it
// is created at link time so the twin always exists. Bridges the wiki
// corpus layer and the code tree so either twin reaches the other in one
// hop. Docs not from a repo walk (uploads, URLs, attached global vaults)
// have no edge.
message MirrorsRel {
  string id        = 1;
  string source_id = 2;   // KnowledgeDoc (corpus::<sha>)
  string target_id = 3;   // File (<repo>/<rel_path>)
}

// DocumentsRel links a Repository to a KnowledgeVault that was spawned from it —
// written only by ``index --wiki`` runs where the wiki compile executes
// alongside a repo walk. Attached global vaults and vaults compiled from
// dropped files/URLs never get this edge: they don't document the repo,
// they merely live alongside it. Joins the wiki layer to the code tree at
// the root, so "what documents this repo?" is a one-hop traversal.
message DocumentsRel {
  string id        = 1;
  string source_id = 2;   // Repository
  string target_id = 3;   // KnowledgeVault (vault::<name>)
}

// MentionsRel links a KnowledgeDoc (which has a body) to an
// Idea/Service/Module/Paper/Person/Event entity whose name appears in that
// body's raw corpus markdown. Bridged the content layer with the flat-entity
// layer so cross-cutting queries worked — "which documents discuss this?".
//
// NOTE (2026-08-04): no producer writes these any more. The wiki ingest
// graph_writer wrote them by whole-word matching against the vault's entity
// set, and that entity layer was removed after three benchmark runs measured
// zero agent usage of it — "which documents discuss X" is now answered by a
// corpus `grep` sweep instead. See agent/src/opentrace_agent/wiki/CLAUDE.md.
// The message is retained so graphs built before then stay readable; do not
// remove or renumber it.
message MentionsRel {
  string id        = 1;
  string source_id = 2;   // KnowledgeDoc
  string target_id = 3;   // Idea / Service / Module / Paper / Person / Event
}

// TargetsRepoRel links a PullRequest to its target Repository.
message TargetsRepoRel {
  string id        = 1;
  string source_id = 2;
  string target_id = 3;
}
