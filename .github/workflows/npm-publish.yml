name: npm Publish

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "ui/**"
  push:
    branches: [main]
    paths:
      - "ui/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to publish (e.g. 0.2.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag (latest, next, preview)"
        required: true
        type: string

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview-npm'))
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: version
        working-directory: ui
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BASE_VERSION=$(node -p "require('./package.json').version")
            echo "version=${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            BASE_VERSION=$(node -p "require('./package.json').version")
            echo "version=${BASE_VERSION}-pr.${PR_NUMBER}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=preview" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@opentrace/opentrace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Set version
        working-directory: ui
        env:
          PKG_VERSION: ${{ needs.version.outputs.version }}
          PKG_TAG: ${{ needs.version.outputs.tag }}
        run: |
          npm version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing @opentrace/opentrace@$PKG_VERSION with tag $PKG_TAG"

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build library
        working-directory: ui
        run: npm run build:lib

      - name: Publish to npm
        working-directory: ui
        env:
          PKG_TAG: ${{ needs.version.outputs.tag }}
        run: NODE_AUTH_TOKEN="" npm publish --tag "$PKG_TAG"

  comment:
    name: Comment on PR
    if: github.event_name == 'pull_request'
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_VERSION: ${{ needs.version.outputs.version }}
        with:
          script: |
            const marker = '<!-- opentrace-npm-preview -->';
            const body = [
              marker,
              `📦 Preview published: \`@opentrace/opentrace@${process.env.PREVIEW_VERSION}\``,
              '',
              '```bash',
              `npm install @opentrace/opentrace@${process.env.PREVIEW_VERSION}`,
              '```',
              '',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
