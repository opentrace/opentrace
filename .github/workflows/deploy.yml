name: Trigger Deployment

on:
  push:
    branches: [main]

jobs:
  trigger-deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: |
          gh api repos/opentrace/opentrace-deployment/dispatches \
            -f event_type=submodule-release \
            -f 'client_payload[branch]=main' \
            -f 'client_payload[trigger_run_id]=${{ github.run_id }}'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}

      - name: Watch triggered run until completion
        run: |
          # Poll until a run appears whose name contains our run ID
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list -R opentrace/opentrace-deployment -e repository_dispatch \
              -L 5 --json databaseId,displayTitle \
              -q '.[] | select(.displayTitle | contains("${{ github.run_id }}")) | .databaseId' \
              | head -1)
            if [ -n "$RUN_ID" ]; then
              echo "Watching opentrace-deployment run $RUN_ID"
              gh run watch "$RUN_ID" -R opentrace/opentrace-deployment --exit-status
              exit $?
            fi
            sleep 2
          done
          echo "::error::Timed out waiting for deployment run to appear"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}

  # oss.opentrace.ai is a STATIC Firebase-hosted SPA (browser-side indexing —
  # there is no server API). The old /api/health and /api/stats checks probed
  # endpoints that don't exist in this architecture, so every deploy since the
  # move to static hosting reported failure while the site was actually fine.
  # These checks assert what the static site really contracts to serve.
  post-deploy-check:
    name: Post-Deploy Health Check
    needs: trigger-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check app shell serves (HTML + root marker)
        run: |
          for i in $(seq 1 10); do
            BODY=$(curl -sf "https://oss.opentrace.ai" || true)
            if echo "$BODY" | grep -q 'id="root"'; then
              echo "App shell check passed"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "::error::App shell missing or malformed after 10 attempts"
          exit 1

      - name: Check hashed JS bundle is served
        run: |
          ASSET=$(curl -sf "https://oss.opentrace.ai" \
            | grep -oE '/assets/[^"]+\.js' | head -1)
          [ -n "$ASSET" ] || { echo "::error::No JS bundle referenced by index.html"; exit 1; }
          echo "Checking $ASSET"
          curl -sf -o /dev/null "https://oss.opentrace.ai$ASSET" \
            || { echo "::error::Bundle $ASSET did not serve"; exit 1; }
          echo "Bundle check passed"

      # SharedArrayBuffer (required by the in-browser LadybugDB/tree-sitter
      # indexer) only exists under cross-origin isolation — a silent header
      # regression would break indexing for every visitor.
      - name: Check COOP/COEP isolation headers
        run: |
          HEADERS=$(curl -sI "https://oss.opentrace.ai")
          echo "$HEADERS" | grep -qi "cross-origin-opener-policy: same-origin" \
            || { echo "::error::Missing COOP header"; exit 1; }
          echo "$HEADERS" | grep -qi "cross-origin-embedder-policy: require-corp" \
            || { echo "::error::Missing COEP header"; exit 1; }
          echo "Isolation headers check passed"

  e2e:
    name: Playwright Smoke
    needs: post-deploy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ui
        run: npx playwright test
        env:
          BASE_URL: https://oss.opentrace.ai

      - name: Upload report on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14
